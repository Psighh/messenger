<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крутой Мессенджер — Вход и Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <div class="card-header">
                <h2>Крутой мессенджер</h2>
                <p>Система взаимодействия студентов и преподавателей</p>
            </div>

            <!-- Переключение вкладок: Вход / Регистрация -->
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="login">Вход</button>
                <button class="tab-btn" data-tab="register">Регистрация</button>
            </div>

            <!-- Контейнер для плавного изменения высоты и анимации форм -->
            <div class="forms-wrapper">
                <!-- Форма Входа -->
                <form id="loginForm" class="form-content active">
                    <div class="input-group">
                        <label for="loginEmail">Электронная почта</label>
                        <input type="email" id="loginEmail" placeholder="example@mail.ru" required>
                    </div>
                    <div class="input-group">
                        <label for="loginPassword">Пароль</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary">Войти</button>
                </form>

                <!-- Форма Регистрации -->
                <form id="registerForm" class="form-content">
                    <div class="input-group">
                        <label>Кто регистрируется?</label>
                        <div class="role-selector">
                            <button type="button" class="role-btn active" data-role="student">Студент</button>
                            <button type="button" class="role-btn" data-role="teacher">Преподаватель</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="regName">ФИО</label>
                        <input type="text" id="regName" placeholder="Иванов Иван Иванович" required>
                    </div>

                    <!-- Динамическое поле: меняется в зависимости от выбранной роли -->
                    <div class="input-group">
                        <label for="regExtra" id="dynamicLabel">Номер группы</label>
                        <input type="text" id="regExtra" placeholder="Например: ПИБ24-Э1" required>
                    </div>

                    <div class="input-group">
                        <label for="regEmail">Электронная почта</label>
                        <input type="email" id="regEmail" placeholder="example@mail.ru" required>
                    </div>

                    <div class="input-group">
                        <label for="regPassword">Пароль</label>
                        <input type="password" id="regPassword" placeholder="Минимум 6 символов" required>
                    </div>

                    <button type="submit" class="btn-primary">Зарегистрироваться</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
